```html
<!DOCTYPE html>
<html>
<head>

    <title>Student Data Analysis System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
        }

        .header p {
            margin-top: 10px;
            font-size: 17px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #d5dbe3;
            text-align: center;
        }

        .container h2 {
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .container p {
            color: #666;
            margin-bottom: 30px;
        }

        input {
            padding: 13px;
            width: 260px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 13px 25px;
            margin-top: 15px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #163a5c;
        }

        .dashboard-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .dashboard-btn:hover {
            background: #256628;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            padding: 20px;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Student Data Analysis System</h1>

        <p>
            Student Performance Analysis Dashboard
        </p>

    </div>


    <div class="container">

        <h2>Search Student</h2>

        <p>
            Enter a Student ID to view the complete performance report.
        </p>


        <form action="/student" method="POST">

            <input
                type="number"
                name="student_id"
                placeholder="Enter Student ID"
                required
            >

            <br>

            <button type="submit">
                Search Student
            </button>

        </form>


        <br>

        <a
            href="/dashboard"
            class="dashboard-btn"
        >
            View Analysis Dashboard
        </a>

    </div>


    <div class="footer">

        Student Data Analysis System © 2026

    </div>

</body>
</html>
